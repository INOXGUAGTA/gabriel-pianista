<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuringa Desenvolvimento Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: aqua;
            box-sizing: border-box;
            font-size: 20px;
        }

        div {
            display: flex;
            flex-flow: column wrap;
            justify-content: center;            
            align-items: center;
        }

        img {
            width: 350px;
            height: auto;
            border: 3px double black;
            border-radius: 20px;
            margin-bottom: 7px;
        }

        h2 {
            color: darkred;
            margin-top: 20px;
        }

        div > p {
            margin-top: 12px;
            text-align: center;
        }

        div > p.wapp {
            margin: 0;
            margin-top: 6px;
            padding: 0;
        }

        div > p.wapp::before {
            content: "\00A0\1F517";
        }

        div > p.wapp::after {
            content: "\00A0\1F517";
        }

        div > p > a.link-wapp {
            text-decoration: none;
        }

        div > p > a.link-wapp:hover {
            text-decoration: underline;
            color: purple;
        } 

        a {
            margin-top: 22px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <audio src="audios/advertising.mp3" autoplay loop></audio>
    <br>
    <div>
        <img src="fotos/kdw.jpeg" alt="Imagem">
        <h2>CRIAÇÃO DE WEBSITES</h2>
        <p>ENTRE EM CONTATO CONOSCO E FAÇA O SEU ORÇAMENTO.</p>
        <p class="wapp"><a class="link-wapp" href="https://api.whatsapp.com/send?phone=5553999220370" target="_blank">WhatsApp: (53) 99922-0370</a></p>
        <a href="index.html">VOLTAR</a>
    </div>    
</body>
</html>
