<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áudios</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    body {
        color: white;
        background-color: lightgreen;
        font-size: 20px;
        box-sizing: border-box;
    }

    h1 {
        background-image: linear-gradient(to right, red, darkblue, purple, black);
        color: yellow;
        border-radius: 10px;
        text-align: center;
        margin: 10px 0;
    }

    div {
        display: flex;
        flex-flow: row wrap;
        justify-content: center;
    }

    audio {
        margin: 10px;
    }

    a {
        color: yellow;
        background-color: darkblue;
        text-decoration: none;
        margin: 10px 0 15px 0;
        padding: 5px 10px;
        border-radius: 10px;
        transition: background .5s;
    }

    a:hover {
        color: aqua;
        background-color: red;
        text-decoration: underline;
    }

    .sombra {
        box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.6);       
    }
</style>
<body> 
    <h1 class="sombra">Áudios</h1>
    <div>
        <audio src="audios/aud-gabriel1.mp3" controls></audio>
        <audio src="audios/aud-gabriel2.ogg" controls></audio>
    </div>    
    <div>
        <audio src="audios/aud-gabriel3.ogg" controls></audio>
        <audio src="audios/aud-gabriel4.ogg" controls></audio>
    </div>    
    <div>
        <audio src="audios/aud-gabriel5.ogg" controls></audio>
        <audio src="audios/aud-gabriel6.ogg" controls></audio>
    </div>    
    <div>
        <audio src="audios/aud-gabriel7.ogg" controls></audio>
        <audio src="audios/aud-gabriel8.ogg" controls></audio>
    </div>    
    <div>
        <audio src="audios/aud-gabriel9.ogg" controls></audio>
    </div>    
    <div>
        <a class="sombra" href="index.html">VOLTAR</a>
    </div>
</body>
</html>
