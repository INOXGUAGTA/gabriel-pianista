<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Áudios</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    body {
        color: white;
        background-color: lightgreen;
    }

    h1 {
        background-image: linear-gradient(to right, red, darkblue, purple, black);
        color: white;
        box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.6);
        border-radius: 10px;
        text-align: center;
        margin: 15px 0;
    }

    div {
        display: flex;
        flex-flow: row wrap;
        justify-content: center;
    }

    a {
        color: yellow;
        background-color: darkblue;
        text-decoration: none;
        margin: 10px 5px;
        padding: 5px 10px;
        border-radius: 10px;
    }

    a:hover {
        color: aqua;
        background-color: red;
        text-decoration: underline;
        transition: .5s;
    }
</style>
<body> 
    <h1>Áudios</h1>   
    <div>
        <a href="index.html">VOLTAR</a>
    </div>
</body>
</html>
