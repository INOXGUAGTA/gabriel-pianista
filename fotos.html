<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    body {
        color: white;
        background-color: lightseagreen;
        font-size: 20px;
        box-sizing: border-box;
    }

    h1 {
        background-image: linear-gradient(to right, red, darkblue, purple, black);
        color: yellow;
        border-radius: 10px;
        text-align: center;
        margin: 15px 0;
    }

    div {
        display: flex;
        flex-flow: row wrap;
        justify-content: center;
    }

    img {
        height: 354px;
        width: auto;
        margin: 7px;
        border: 2px solid black;
        border-radius: 15px;
    }

    img#foto9 {
        width: 370px;
        height: auto;
    }

    a {
        color: yellow;
        background-color: darkblue;
        text-decoration: none;
        margin: 10px 0 15px 0;
        padding: 5px 10px;
        border-radius: 10px;
        transition: background .5s;
    }

    a:hover {
        color: aqua;
        background-color: red;
        text-decoration: underline;
    }

    .sombra {
        box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.6);
    }
</style>
<body> 
    <h1 class="sombra">Fotos</h1>
    <div>
        <img src="fotos/foto-gabriel1.jpg" alt="Imagem">
        <img src="fotos/foto-gabriel2.jpg" alt="Imagem">
    </div>
    <div>
        <img src="fotos/foto-gabriel3.jpg" alt="Imagem">
        <img src="fotos/foto-gabriel4.jpeg" alt="Imagem">
    </div>
    <div>
        <img src="fotos/foto-gabriel5.jpeg" alt="Imagem">
        <img src="fotos/foto-gabriel6.jpeg" alt="Imagem">
    </div>
    <div>
        <img src="fotos/foto-gabriel7.jpeg" alt="Imagem">
        <img src="fotos/foto-gabriel8.jpeg" alt="Imagem">
    </div>
    <div>
        <img id="foto9" src="fotos/foto-gabriel9.jpeg" alt="Imagem">
    </div>
    <div>
        <a class="sombra" href="index.html">VOLTAR</a>
    </div>
</body>
</html>
