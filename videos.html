<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    body {
        color: white;
        background-color: goldenrod;
        font-size: 20px;
        box-sizing: border-box;
    }

    h1 {
        background-image: linear-gradient(to right, red, darkblue, purple, black);
        color: yellow;
        border-radius: 10px;
        text-align: center;
        margin: 15px 0;
    }

    div {
        display: flex;
        flex-flow: row wrap;
        justify-content: center;
    }

    video {
        height: 354px;
        width: 354px;
        margin: 7px 20px;
        border: 2px solid black;
        border-radius: 15px;
    }

    a {
        color: yellow;
        background-color: darkblue;
        text-decoration: none;
        margin: 10px 0 15px 0;
        padding: 5px 10px;
        border-radius: 10px;
        transition: background .5s;
    }

    a:hover {
        color: aqua;
        background-color: red;
        text-decoration: underline;
    }

    .sombra {
        box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.6);
    }
</style>
<body> 
    <h1 class="sombra">Vídeos</h1>
    <div>
        <video src="videos/vid-gabriel4.mp4" controls></video>
        <video src="videos/vid-gabriel1.mp4" controls></video>
    </div>
    <div>
        <video src="videos/vid-gabriel2.mp4" controls></video>
        <video src="videos/vid-gabriel3.mp4" controls></video>
    </div>
    <div>
        <video src="videos/vid-gabriel5.mp4" controls></video>
        <video src="videos/vid-gabriel6.mp4" controls></video>
    </div>
    <div>
        <video src="videos/vid-gabriel7.mp4" controls></video>
        <video src="videos/vid-gabriel8.mp4" controls></video>
    </div>
    <div>
        <video src="videos/vid-gabriel9.mp4" controls></video>
        <video src="videos/vid-gabriel10.mp4" controls></video>
    </div>
    <div>
        <video src="videos/vid-gabriel11.mp4" controls></video>
        <video src="videos/vid-gabriel12.mp4" controls></video>
    </div>
    <div>
        <a class="sombra" href="index.html">VOLTAR</a>
    </div>
</body>
</html>
